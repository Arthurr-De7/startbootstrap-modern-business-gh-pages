<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acervo Digital - Soft Hair</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>
        .card {
            transition: .3s
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, .15)
        }

        .card-img-top {
            height: 350px;
            object-fit: cover
        }

        .overlay {
            background: linear-gradient(to top, rgba(0, 0, 0, .8), transparent)
        }
    </style>
</head>

<body class="min-vh-100 bg-light d-flex flex-column">

    <header class="bg-white py-5 text-center">
        <h1 class="fw-bold display-5">Acervo Digital</h1>

        <div class="container mt-4">
            <div class="row g-4 justify-content-center">
                <div class="col-lg-4">
                    <div class="card p-4 text-center shadow-sm">
                        <i class="fas fa-layer-group fa-3x text-primary mb-2"></i>
                        <h3 class="fw-bold display-6 mb-0">0</h3>
                        <small class="text-muted">Linhas</small>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card p-4 text-center shadow-sm">
                        <i class="fas fa-box-open fa-3x text-warning mb-2"></i>
                        <h3 class="fw-bold display-6 mb-0">0</h3>
                        <small class="text-muted">Produtos</small>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card p-4 text-center shadow-sm">
                        <i class="fas fa-check fa-3x text-success mb-2"></i>
                        <h3 class="fw-bold display-6 mb-0">0</h3>
                        <small class="text-muted">Ativos</small>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-5">

        <form class="input-group input-group-lg mb-5">
            <input class="form-control rounded-pill rounded-end-0" placeholder="Pesquisar linha ou produto">
            <button class="btn btn-dark rounded-pill rounded-start-0">
                <i class="fas fa-search"></i>
            </button>
        </form>

        <h2 class="fw-bold mb-4">Linhas Capilares</h2>

        <div class="row g-4">
            <!-- CARD PADRÃO -->
            <div class="col-sm-6 col-lg-4 col-xl-3">
                <div class="card border-0 rounded-4 overflow-hidden shadow">
                    <div class="position-relative">
                        <img src="/assets/capateiga.png" class="card-img-top">
                        <div class="overlay position-absolute top-0 w-100 h-100"></div>
                    </div>
                    <div class="card-img-overlay d-flex flex-column justify-content-end text-white text-center">
                        <h5 class="fw-bold">Linha Soft</h5>
                        <small class="mb-3">Cuidado diário</small>
                        <a href="/listaProdutos.html" class="btn btn-outline-light btn-sm rounded-pill">
                            Ver Produtos
                        </a>
                    </div>
                </div>
            </div>

            <!-- duplicar SOMENTE este bloco -->
        </div>

    </main>

    <footer class="bg-white border-top py-3 text-center text-muted small">
        01/2026 · SICS Web Project
    </footer>

</body>

</html>
