<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos os Produtos - ACERVO DIGITAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="w-50 mt-4 text-start">
            <a href="/telainicio.html" class="btn btn-outline-dark w-25  ">
                <i class="fas fa-arrow-left me-2"></i> Voltar
            </a>
        </div>
        <div class="py-5 text-center">
            <p class="lead fs-1 text-muted my-5">Acervo Digital</p>
            <div class="row g-4 justify-content-center">
                <div class="col-lg-4">
                    <div class="bg-white border border-dark rounded p-4 ">
                        <i class="fas fa-layer-group fa-3x mb-3 text-warning"></i>
                        <h3 class="fw-bold display-5 mb-1">0</h3>
                        <p class="mb-0 text-muted">Linhas Capilares</p>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="bg-white border border-dark rounded p-4 ">
                        <i class="fas fa-box-open fa-3x mb-3 text-primary"></i>
                        <h3 class="fw-bold display-5 mb-1">0</h3>
                        <p class="mb-0 text-muted">Produtos</p>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="bg-white border border-dark rounded p-4 ">
                        <i class="fa-solid fa-check fa-3x mb-3 text-success"></i>
                        <h3 class="fw-bold display-5 mb-1">0</h3>
                        <p class="mb-0 text-muted">Produtos Ativos</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row my-5 justify-content-between align-items-center">
            <div class="col-md-6 col-12 mb-3 mb-md-0">
                <form class="input-group input-group-lg">
                    <input type="search" class="form-control" placeholder="Pesquisar linha ou produto"
                        aria-label="Pesquisar">
                    <button class="btn btn-dark" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
            </div>
            <div class="col-md-4 col-12">
                <div class="btn-group w-100" role="group" aria-label="Filtros de status">
                    <input type="radio" class="btn-check" name="filtro" id="todos" autocomplete="off" checked>
                    <label class="btn btn-outline-dark" for="todos">
                        <i class="fas fa-list me-1"></i> Todos
                    </label>

                    <input type="radio" class="btn-check" name="filtro" id="ativos" autocomplete="off">
                    <label class="btn btn-outline-success" for="ativos">
                        <i class="fas fa-check me-1"></i> Ativos
                    </label>

                    <input type="radio" class="btn-check" name="filtro" id="inativos" autocomplete="off">
                    <label class="btn btn-outline-danger" for="inativos">
                        <i class="fas fa-times me-1"></i> Inativos
                    </label>
                </div>
            </div>
        </div>


        <h2 class="fw-bold my-5 py-3 w-25" style="border-bottom: 4px solid purple">Lisa Esfoliante</h2>
        <div class="row g-4 border border-3">
            <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3">
                <div class="card h-100 border-0">
                    <div class="card-header border-0 pb-0">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-dark">SH-02</span>
                            <span class="badge bg-dark">
                                <i class="fas fa-check fa-xs me-1"></i> ATIVO
                            </span>
                        </div>
                    </div>
                    <img src="https://softhair.com.br/wp-content/uploads/2024/07/6246-416x416.png"
                        class="card-img-top p-3" alt="Produto 2">
                    <div class="card-body pt-0">
                        <h6 class="card-title fw-bold mb-2">Produto 2</h6>
                        <p class="card-text small  text-dark mb-0">Descrição do Produto 2</p>
                    </div>
                </div>
            </div>

            <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3">
                <div class="card h-100 border-0">
                    <div class="card-header border-0 pb-0">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-dark">SH-03</span>
                            <span class="badge bg-danger">
                                <i class="fas fa-times fa-xs me-1"></i> INATIVO
                            </span>
                        </div>
                    </div>
                    <img src="https://softhair.com.br/wp-content/uploads/2024/07/6246-416x416.png"
                        class="card-img-top p-3" alt="Produto 3">
                    <div class="card-body pt-0">
                        <h6 class="card-title fw-bold mb-2">Produto 3</h6>
                        <p class="card-text small  text-dark mb-0">Descrição do Produto 3</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white mt-auto py-4">
        <div class="container text-center text-muted small">
            03/2021 - SICS Web Project
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
